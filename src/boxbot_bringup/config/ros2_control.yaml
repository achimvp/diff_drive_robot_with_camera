#       - camera_body_joint
#       - camera_head_joint
#     interface_name: effort
#     command_interfaces:
#       - position
#     state_interfaces:
#       - position
#       - velocity
    
    # gains:
    #   camera_body_joint:
    #     p: 40.0
    #     i: 0.0
    #     d: 10.0
    #   camera_head_joint:
    #     p: 40.0
    #     i: 0.0
    #     d: 10.0

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - left_wheel_joint
    right_wheel_names:
      - right_wheel_joint
    wheel_separation: 0.34  # meters
    wheel_radius: 0.05      # meters
    cmd_vel_timeout: 0.5    # seconds
    # use_stamped_vel: false
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0    # m/s
        min_velocity: -1.0   # m/s
        max_acceleration: 2.0 # m/s^2
        min_acceleration: -2.0 # m/s^2
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.0     # rad/s
        min_velocity: -2.0    # rad/s
        max_acceleration: 4.0  # rad/s^2
        min_acceleration: -4.0 # rad/s^2

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"